{% extends "base.html" %}
{% block content %}
<h1>Новая трата</h1>
<form method="POST">
    <input name="amount" type="number" step="0.01" placeholder="Сумма" required>
    <input name="category" placeholder="Категория (еда, игры, транспорт)" required>
    <input name="comment" placeholder="Комментарий (необязательно)">
    <button type="submit">Добавить</button>
</form>
{% endblock %}
